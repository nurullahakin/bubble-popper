<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bubble Popper</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: linear-gradient(#7fd3ff, #c9f0ff 60%, #e9fbff);
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", sans-serif;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: pointer; }
  #score {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,.8); color: #ff6fa8;
    padding: 8px 26px; border-radius: 40px;
    font-size: 40px; font-weight: bold;
    box-shadow: 0 4px 0 rgba(0,0,0,.08);
    pointer-events: none;
  }
  #sound {
    position: fixed; top: 14px; right: 14px;
    width: 60px; height: 60px; border: none; border-radius: 50%;
    background: rgba(255,255,255,.8); font-size: 30px; cursor: pointer;
  }
  /* wand recharge meter: the ring fills up while the wand recharges */
  #wandMeter {
    position: fixed; top: 14px; left: 14px;
    width: 60px; height: 60px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 30px; pointer-events: none;
    --p: 1;
    background:
      radial-gradient(circle, rgba(255,255,255,.9) 0 23px, transparent 24px),
      conic-gradient(#ff6fa8 calc(var(--p) * 360deg), rgba(255,255,255,.5) 0);
  }
  #wandMeter span { transition: opacity .3s, filter .3s; }
  #wandMeter.charging span { opacity: .35; filter: grayscale(1); }
  #wandMeter.ready span { animation: wiggle 1.2s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { transform: rotate(-12deg) scale(1); } 50% { transform: rotate(12deg) scale(1.15); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="score">⭐ 0</div>
<button id="sound" aria-label="Toggle sound">🔊</button>
<div id="wandMeter" class="ready" aria-hidden="true"><span>🪄</span></div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const soundBtn = document.getElementById('sound');

// No right-click / long-press menu (little fingers hold the screen a lot)
document.addEventListener('contextmenu', e => e.preventDefault());

let W, H, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ---------- Sound ----------
let audio = null, master = null, noiseBuf = null, soundOn = true;
function ac() {
  if (!audio) {
    audio = new (window.AudioContext || window.webkitAudioContext)();
    master = audio.createDynamicsCompressor();
    master.connect(audio.destination);
    noiseBuf = audio.createBuffer(1, audio.sampleRate * 2, audio.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (audio.state === 'suspended') audio.resume();
  return audio;
}

// Pop = a quick bubbly "blip" plus a xylophone-like note for the bubble's color.
function pop(note) {
  if (!soundOn) return;
  const a = ac(), t = a.currentTime;

  // the blip
  const osc = a.createOscillator();
  const gain = a.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(note, t);
  osc.frequency.exponentialRampToValueAtTime(note * 2.5, t + 0.06);
  gain.gain.setValueAtTime(0.2, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  osc.connect(gain).connect(master);
  osc.start(t); osc.stop(t + 0.11);

  // the musical note: fundamental + a bright overtone, ringing out
  for (const [mult, vol, len] of [[1, 0.35, 0.9], [4, 0.08, 0.25]]) {
    const o = a.createOscillator(), g = a.createGain();
    o.type = mult === 1 ? 'triangle' : 'sine';
    o.frequency.value = note * mult;
    g.gain.setValueAtTime(0.0001, t + 0.02);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.03 + len);
    o.connect(g).connect(master);
    o.start(t + 0.02); o.stop(t + 0.05 + len);
  }
}

// Ramp an AudioParam through [[time, value], ...] (times relative to t0).
function ramp(param, pts, t0) {
  if (typeof pts === 'number') { param.setValueAtTime(pts, t0); return; }
  param.setValueAtTime(pts[0][1], t0 + pts[0][0]);
  for (let i = 1; i < pts.length; i++) param.linearRampToValueAtTime(pts[i][1], t0 + pts[i][0]);
}

// One synthesized voice: oscillator or noise -> filters -> envelope -> tremolo -> out.
//   wave/freq: source pitch curve   amp: loudness curve   filters: [{type, f, Q}]
//   vib: {rate, depth} pitch wobble  am: {rate, depth, wave} loudness wobble (growl/buzz)
function voice(t0, o) {
  const a = audio;
  const end = t0 + o.amp[o.amp.length - 1][0] + 0.05;
  let src;
  if (o.noise) {
    src = a.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  } else {
    src = a.createOscillator(); src.type = o.wave || 'sawtooth';
    ramp(src.frequency, o.freq, t0);
    if (o.vib) {
      const l = a.createOscillator(), lg = a.createGain();
      l.frequency.value = o.vib.rate; lg.gain.value = o.vib.depth;
      l.connect(lg).connect(src.frequency); l.start(t0); l.stop(end);
    }
  }
  let node = src;
  for (const f of o.filters || []) {
    const bq = a.createBiquadFilter();
    bq.type = f.type; bq.Q.value = f.Q || 1;
    ramp(bq.frequency, f.f, t0);
    node.connect(bq); node = bq;
  }
  const env = a.createGain();
  env.gain.value = 0;
  ramp(env.gain, o.amp, t0);
  node.connect(env); node = env;
  if (o.am) {
    const trem = a.createGain(), l = a.createOscillator(), lg = a.createGain();
    trem.gain.value = 1 - o.am.depth / 2;
    l.type = o.am.wave || 'sine'; l.frequency.value = o.am.rate; lg.gain.value = o.am.depth / 2;
    l.connect(lg).connect(trem.gain); l.start(t0); l.stop(end);
    node.connect(trem); node = trem;
  }
  node.connect(master);
  src.start(t0); src.stop(end);
}

const SOUNDS = {
  dog(t) {           // woof woof
    for (const d of [0, 0.3]) {
      voice(t + d, { freq: [[0, 380], [0.03, 450], [0.16, 200]],
        amp: [[0, 0], [0.015, 0.8], [0.08, 0.5], [0.18, 0]],
        filters: [{ type: 'lowpass', f: [[0, 2000], [0.18, 500]], Q: 5 }] });
      voice(t + d, { noise: true, amp: [[0, 0], [0.01, 0.4], [0.07, 0]],
        filters: [{ type: 'bandpass', f: 600, Q: 1 }] });
    }
  },
  cat(t) {           // meeeow
    voice(t, { freq: [[0, 480], [0.25, 780], [0.55, 720], [0.85, 470]],
      amp: [[0, 0], [0.06, 0.7], [0.65, 0.6], [0.85, 0]],
      filters: [{ type: 'bandpass', f: [[0, 900], [0.3, 2200], [0.85, 800]], Q: 2 }],
      vib: { rate: 6, depth: 10 } });
  },
  cow(t) {           // mooooo
    voice(t, { freq: [[0, 115], [0.3, 150], [1.0, 140], [1.5, 100]],
      amp: [[0, 0], [0.2, 0.7], [1.2, 0.6], [1.5, 0]],
      filters: [{ type: 'lowpass', f: [[0, 300], [0.35, 800], [1.5, 350]], Q: 6 }],
      vib: { rate: 5, depth: 3 } });
  },
  pig(t) {           // oink oink
    for (const d of [0, 0.26]) {
      voice(t + d, { freq: [[0, 190], [0.18, 150]],
        amp: [[0, 0], [0.02, 1], [0.14, 0.7], [0.2, 0]],
        filters: [{ type: 'bandpass', f: [[0, 700], [0.2, 1100]], Q: 3 }],
        am: { rate: 30, depth: 0.8 } });
    }
  },
  sheep(t) {         // baa-a-a
    voice(t, { freq: [[0, 320], [0.1, 360], [0.9, 290]],
      amp: [[0, 0], [0.05, 0.6], [0.75, 0.5], [0.95, 0]],
      filters: [{ type: 'lowpass', f: 2400, Q: 2 }],
      vib: { rate: 11, depth: 25 }, am: { rate: 11, depth: 0.6 } });
  },
  duck(t) {          // quack quack
    for (const d of [0, 0.3]) {
      voice(t + d, { freq: [[0, 280], [0.2, 210]],
        amp: [[0, 0], [0.02, 1], [0.15, 0.8], [0.22, 0]],
        filters: [{ type: 'bandpass', f: 1400, Q: 3 }],
        am: { rate: 45, depth: 0.6 } });
    }
  },
  frog(t) {          // rib-bit
    for (const [d, len] of [[0, 0.1], [0.17, 0.22]]) {
      voice(t + d, { wave: 'square', freq: [[0, 190], [len, 140]],
        amp: [[0, 0], [0.01, 0.5], [len - 0.02, 0.45], [len, 0]],
        filters: [{ type: 'lowpass', f: 900, Q: 6 }],
        am: { rate: 38, depth: 1, wave: 'square' } });
    }
  },
  lion(t) {          // rooaarr
    voice(t, { noise: true, amp: [[0, 0], [0.3, 1], [1.0, 0.7], [1.6, 0]],
      filters: [{ type: 'lowpass', f: [[0, 350], [0.4, 900], [1.6, 250]], Q: 4 }],
      am: { rate: 20, depth: 0.6 } });
    voice(t, { freq: [[0, 90], [0.4, 140], [1.6, 70]],
      amp: [[0, 0], [0.3, 0.5], [1.0, 0.4], [1.6, 0]],
      filters: [{ type: 'lowpass', f: 600, Q: 2 }], am: { rate: 20, depth: 0.7 } });
  },
  owl(t) {           // hoo hoo
    for (const d of [0, 0.55]) {
      voice(t + d, { wave: 'sine', freq: [[0, 370], [0.1, 420], [0.4, 360]],
        amp: [[0, 0], [0.08, 0.7], [0.3, 0.55], [0.45, 0]], vib: { rate: 5, depth: 4 } });
    }
  },
  chick(t) {         // tweet tweet tweet
    for (const d of [0, 0.15, 0.3]) {
      voice(t + d, { wave: 'sine', freq: [[0, 2300], [0.08, 3800]],
        amp: [[0, 0], [0.01, 0.35], [0.09, 0]] });
    }
  },
  mouse(t) {         // squeak squeak
    for (const d of [0, 0.14, 0.28]) {
      voice(t + d, { wave: 'sine', freq: [[0, 3300], [0.04, 3900], [0.07, 3500]],
        amp: [[0, 0], [0.01, 0.3], [0.08, 0]] });
    }
  },
  elephant(t) {      // trumpet
    voice(t, { freq: [[0, 450], [0.15, 750], [0.8, 700], [1.1, 520]],
      amp: [[0, 0], [0.08, 0.8], [0.9, 0.7], [1.1, 0]],
      filters: [{ type: 'bandpass', f: 1300, Q: 1.5 }], vib: { rate: 7, depth: 18 } });
    voice(t, { noise: true, amp: [[0, 0], [0.08, 0.25], [1.1, 0]],
      filters: [{ type: 'bandpass', f: 1500, Q: 2 }] });
  },
};

soundBtn.addEventListener('pointerdown', e => {
  e.stopPropagation();
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? '🔊' : '🔇';
});

// ---------- Bubbles ----------
// Each color always plays the same note (C major pentatonic, rainbow order low -> high),
// so any sequence of pops sounds like a little tune.
const COLORS = [
  { rgb: [255,120,170], note: 523.25 },  // pink   - C
  { rgb: [255,160,100], note: 587.33 },  // orange - D
  { rgb: [255,210,90],  note: 659.25 },  // yellow - E
  { rgb: [140,230,140], note: 783.99 },  // green  - G
  { rgb: [120,200,255], note: 880.00 },  // blue   - A
  { rgb: [190,140,255], note: 1046.50 }, // purple - high C
];
const ANIMALS = [
  { emoji: '🐶', name: 'dog' },
  { emoji: '🐱', name: 'cat' },
  { emoji: '🐮', name: 'cow' },
  { emoji: '🐷', name: 'pig' },
  { emoji: '🐑', name: 'sheep' },
  { emoji: '🦆', name: 'duck' },
  { emoji: '🐸', name: 'frog' },
  { emoji: '🦁', name: 'lion' },
  { emoji: '🦉', name: 'owl' },
  { emoji: '🐤', name: 'chick' },
  { emoji: '🐭', name: 'mouse' },
  { emoji: '🐘', name: 'elephant' },
];
const ANIMAL_CHANCE = 0.4;   // share of bubbles that carry an animal

// Optional real recordings: put sounds/<name>.mp3 next to this file (e.g. sounds/cow.mp3),
// add the animal's name here, and it is used instead of the synthesized sound.
// e.g. const RECORDINGS = ['cow', 'dog'];
const RECORDINGS = [];
for (const a of ANIMALS.filter(a => RECORDINGS.includes(a.name))) {
  const clip = new Audio(`sounds/${a.name}.mp3`);
  clip.preload = 'auto';
  clip.addEventListener('canplaythrough', () => { a.clip = clip; }, { once: true });
}

function animalSound(a) {
  if (!soundOn) return;
  if (a.clip) {
    const c = a.clip.cloneNode();
    c.volume = 0.9;
    c.play().catch(() => {});
    return;
  }
  ac();
  SOUNDS[a.name](audio.currentTime + 0.02);
}
const MAX_BUBBLES = 12;
const rand = (a, b) => a + Math.random() * (b - a);

const bubbles = [];
const particles = [];
let score = 0;

function makeBubble(fromEdge) {
  const minSide = Math.min(W, H);
  const r = rand(minSide * 0.06, minSide * 0.11) + 20;   // big enough for little fingers
  return {
    x: rand(r, W - r),
    y: fromEdge ? H + r : rand(r, H - r),
    r,
    vx: rand(-40, 40),
    vy: fromEdge ? rand(-90, -50) : rand(-40, 40),
    wobble: rand(0, Math.PI * 2),
    ...(c => ({ color: c.rgb, note: c.note }))(COLORS[Math.floor(Math.random() * COLORS.length)]),
    animal: Math.random() < ANIMAL_CHANCE ? ANIMALS[Math.floor(Math.random() * ANIMALS.length)] : null,
    scale: fromEdge ? 1 : 0,          // grows in when spawned in place
  };
}

for (let i = 0; i < MAX_BUBBLES; i++) bubbles.push(makeBubble(false));

function update(dt) {
  for (const b of bubbles) {
    // random gentle drift: nudge velocity a little each frame
    b.vx += rand(-60, 60) * dt;
    b.vy += rand(-60, 60) * dt;
    const speed = Math.hypot(b.vx, b.vy), maxV = 70;
    if (speed > maxV) { b.vx *= maxV / speed; b.vy *= maxV / speed; }

    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.wobble += dt * 3;
    b.scale = Math.min(1, Math.max(0, b.scale + dt * 3));

    // bounce softly off the walls (allow entering from the bottom)
    if (b.x < b.r)     { b.x = b.r;     b.vx = Math.abs(b.vx); }
    if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); }
    if (b.y < b.r)     { b.y = b.r;     b.vy = Math.abs(b.vy); }
    if (b.y > H - b.r && b.vy > 0) { b.vy = -Math.abs(b.vy); }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 300 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  while (bubbles.length < MAX_BUBBLES) bubbles.push(makeBubble(true));
}

function drawBubble(b) {
  const s = b.scale;
  const sx = 1 + Math.sin(b.wobble) * 0.04;
  const sy = 1 - Math.sin(b.wobble) * 0.04;
  const r = b.r * s;
  const [cr, cg, cb] = b.color;

  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.scale(sx, sy);

  // body
  const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
  g.addColorStop(0, `rgba(255,255,255,0.25)`);
  g.addColorStop(0.7, `rgba(${cr},${cg},${cb},0.35)`);
  g.addColorStop(1, `rgba(${cr},${cg},${cb},0.85)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();

  // rim
  ctx.lineWidth = 3;
  ctx.strokeStyle = `rgba(255,255,255,0.7)`;
  ctx.stroke();

  // picture inside
  if (b.animal) {
    ctx.font = `${r * 1.0}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = 0.95;
    ctx.fillText(b.animal.emoji, 0, r * 0.05);
    ctx.globalAlpha = 1;
  }

  // shine
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.ellipse(-r * 0.4, -r * 0.45, r * 0.22, r * 0.12, -0.7, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(-r * 0.12, -r * 0.62, r * 0.06, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawWand();
  for (const b of bubbles) drawBubble(b);
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    if (p.emoji) {
      // freed animal floats up (no gravity) and fades
      p.vy = -60;
      ctx.font = `${p.size}px serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(p.emoji, p.x, p.y);
    } else if (p.star) {
      ctx.font = `${p.size}px serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('⭐', p.x, p.y);
    } else {
      ctx.fillStyle = `rgb(${p.color.join(',')})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function burst(b) {
  for (let i = 0; i < 18; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(120, 320);
    particles.push({
      x: b.x + Math.cos(a) * b.r * 0.8, y: b.y + Math.sin(a) * b.r * 0.8,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80,
      size: rand(3, 8), color: b.color, life: 0.7, maxLife: 0.7,
    });
  }
  for (let i = 0; i < 3; i++) {
    particles.push({
      x: b.x, y: b.y, vx: rand(-120, 120), vy: rand(-300, -180),
      size: rand(22, 34), star: true, life: 1, maxLife: 1,
    });
  }
}

// ---------- Bubble wand: dragging leaves a trail of tiny bubbles ----------
const wand = [];
const MAX_WAND = 160;
const WAND_SPACING = 26;          // px of finger travel per wand bubble
let lastTinkle = 0;

// soft "bloop" when a wand bubble is blown (throttled so dragging sounds bubbly, not buzzy)
let lastBlow = 0;
function blowSound(note) {
  if (!soundOn) return;
  const a = ac(), t = a.currentTime;
  if (t - lastBlow < 0.09) return;
  lastBlow = t;

  // round, low bubble "bloop": pitch rises like air filling a bubble
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(note * 0.35, t);
  o.frequency.exponentialRampToValueAtTime(note * 0.7, t + 0.12);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.16, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
  o.connect(g).connect(master);
  o.start(t); o.stop(t + 0.17);

  // tiny breath of air
  const n = a.createBufferSource(), f = a.createBiquadFilter(), ng = a.createGain();
  n.buffer = noiseBuf;
  f.type = 'bandpass'; f.frequency.value = 1200; f.Q.value = 0.8;
  ng.gain.setValueAtTime(0.05, t);
  ng.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  n.connect(f).connect(ng).connect(master);
  n.start(t, Math.random()); n.stop(t + 0.11);
}

function spawnWandBubble(x, y) {
  if (wand.length >= MAX_WAND) wand.shift();
  const c = COLORS[Math.floor(Math.random() * COLORS.length)];
  blowSound(c.note);
  const life = rand(1.8, 3.2);
  wand.push({
    x: x + rand(-8, 8), y: y + rand(-8, 8),
    r: rand(14, 30),
    vx: rand(-25, 25), vy: rand(-70, -30),
    wobble: rand(0, Math.PI * 2),
    color: c.rgb, note: c.note,
    life, maxLife: life,
  });
}

// soft, high "tink" when a tiny bubble pops on its own (throttled so it never gets noisy)
function tinkle(note) {
  if (!soundOn || !audio) return;
  const t = audio.currentTime;
  if (t - lastTinkle < 0.08) return;
  lastTinkle = t;

  // bubbly "plip": quick upward pitch sweep
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(note * 0.8, t);
  o.frequency.exponentialRampToValueAtTime(note * 2, t + 0.05);
  g.gain.setValueAtTime(0.18, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
  o.connect(g).connect(master);
  o.start(t); o.stop(t + 0.09);

  // little ringing note in the bubble's color, an octave up
  const n = audio.createOscillator(), ng = audio.createGain();
  n.type = 'triangle'; n.frequency.value = note * 2;
  ng.gain.setValueAtTime(0.0001, t + 0.01);
  ng.gain.exponentialRampToValueAtTime(0.16, t + 0.02);
  ng.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
  n.connect(ng).connect(master);
  n.start(t + 0.01); n.stop(t + 0.42);
}

function updateWand(dt) {
  for (let i = wand.length - 1; i >= 0; i--) {
    const w = wand[i];
    w.wobble += dt * 4;
    w.x += (w.vx + Math.sin(w.wobble) * 15) * dt;
    w.y += w.vy * dt;
    w.vy -= 10 * dt;             // drift up a little faster over time
    w.life -= dt;
    if (w.life <= 0 || w.y < -w.r) {
      wand.splice(i, 1);
      if (w.life <= 0) {
        for (let k = 0; k < 6; k++) {
          const a = rand(0, Math.PI * 2), sp = rand(60, 140);
          particles.push({ x: w.x, y: w.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                           size: rand(2.5, 5), color: w.color, life: 0.4, maxLife: 0.4 });
        }
        tinkle(w.note);
      }
    }
  }
}

function drawWand() {
  for (const w of wand) {
    const [cr, cg, cb] = w.color;
    // grow in quickly, then fade over the last half second
    const age = w.maxLife - w.life;
    const r = w.r * Math.min(1, age * 6);
    ctx.globalAlpha = Math.min(1, w.life * 2);
    ctx.fillStyle = `rgba(${cr},${cg},${cb},0.25)`;
    ctx.strokeStyle = `rgba(${cr},${cg},${cb},0.9)`;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(w.x, w.y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(w.x - r * 0.35, w.y - r * 0.35, r * 0.25, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---------- Input ----------
function tryPop(x, y) {
  // check top-most bubble first; generous hit area for small hands
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    if (b.scale > 0.5 && Math.hypot(x - b.x, y - b.y) <= b.r * 1.15) {
      bubbles.splice(i, 1);
      burst(b);
      pop(b.note);
      if (b.animal) {
        const a = b.animal;
        setTimeout(() => animalSound(a), 150);   // let the pop be heard first
        particles.push({ x: b.x, y: b.y, vx: 0, vy: -60, size: b.r * 1.2,
                         emoji: a.emoji, life: 1.2, maxLife: 1.2 });
      }
      score++;
      scoreEl.textContent = '⭐ ' + score;
      return;
    }
  }
}

// ---------- Wand cooldown: one use, then it recharges ----------
// A "use" starts with the first drag after the wand is ready and lasts until all fingers
// lift (or WAND_MAX_USE seconds pass, so holding a finger down forever doesn't count as one use).
const WAND_COOLDOWN = 10;       // seconds before the wand works again
const WAND_MAX_USE = 3;           // seconds a single use can last
let wandActiveUntil = 0;          // > 0 while a use is in progress
let wandReadyAt = 0;              // time (s) when the wand is ready again
const wandMeter = document.getElementById('wandMeter');
const nowSec = () => performance.now() / 1000;

function endWandUse(at) {
  if (!wandActiveUntil) return;
  wandActiveUntil = 0;
  wandReadyAt = at + WAND_COOLDOWN;
}

function wandCanSpawn() {
  const now = nowSec();
  if (wandActiveUntil) {
    if (now < wandActiveUntil) return true;
    endWandUse(wandActiveUntil);   // ran out of time mid-drag
    return false;
  }
  if (now >= wandReadyAt) {        // ready: start a new use
    wandActiveUntil = now + WAND_MAX_USE;
    return true;
  }
  return false;
}

function updateWandMeter() {
  const now = nowSec();
  if (wandActiveUntil && now >= wandActiveUntil) endWandUse(wandActiveUntil);
  const charging = !wandActiveUntil && now < wandReadyAt;
  const p = charging ? 1 - (wandReadyAt - now) / WAND_COOLDOWN : 1;
  wandMeter.style.setProperty('--p', p.toFixed(3));
  wandMeter.className = charging ? 'charging' : (wandActiveUntil ? '' : 'ready');
}

// Track each finger separately so multi-touch wands work too.
const pointers = new Map();   // pointerId -> {x, y, carry}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture?.(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, carry: 0 });
  tryPop(e.clientX, e.clientY);   // a plain tap pops but doesn't use up the wand
});

canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;                               // mouse hovering without a button held
  const x = e.clientX, y = e.clientY;
  const dx = x - p.x, dy = y - p.y, dist = Math.hypot(dx, dy);
  // drop tiny bubbles evenly along the path, however fast the finger moves
  let d = WAND_SPACING - p.carry;
  while (d <= dist && wandCanSpawn()) {
    spawnWandBubble(p.x + dx * d / dist, p.y + dy * d / dist);
    d += WAND_SPACING;
  }
  p.carry = (p.carry + dist) % WAND_SPACING;
  p.x = x; p.y = y;
  tryPop(x, y);                                 // swiping through big bubbles pops them too
});

const endPointer = e => {
  pointers.delete(e.pointerId);
  if (pointers.size === 0) endWandUse(nowSec());   // all fingers lifted: start recharging
};
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

// ---------- Loop ----------
let last = performance.now();
function loop(now) {
  // rAF's first timestamp can be slightly earlier than performance.now() at startup,
  // so clamp to avoid a negative step (which made bubble radii negative)
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
  last = now;
  update(dt);
  updateWand(dt);
  updateWandMeter();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
